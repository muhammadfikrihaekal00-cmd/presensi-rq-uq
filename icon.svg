<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Islamic Geometric Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="12, 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Holy Quran Icon Graphic -->
  <g transform="translate(136, 126)" filter="url(#shadow)">
    <!-- Quran Book Base (Rehal / Open Book) -->
    <path d="M120 40 C70 10, 20 25, 0 35 L0 180 C20 170, 70 155, 120 185 C170 155, 220 170, 240 180 L240 35 C220 25, 170 10, 120 40 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M120 40 L120 185" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Quran Ayah Lines Left -->
    <line x1="25" y1="70" x2="95" y2="70" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="25" y1="95" x2="95" y2="95" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="25" y1="120" x2="80" y2="120" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="25" y1="145" x2="65" y2="145" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <!-- Quran Ayah Lines Right -->
    <line x1="145" y1="70" x2="215" y2="70" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="145" y1="95" x2="215" y2="95" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="145" y1="120" x2="200" y2="120" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="175" y1="145" x2="215" y2="145" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Checkmark Badge on bottom right -->
    <circle cx="210" cy="180" r="32" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
    <polyline points="198,180 206,188 222,172" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Islamic Crescent & Star Accent at Top -->
  <g transform="translate(256, 80) scale(0.9)">
    <path d="M-12,-16 A16,16 0 1,0 12,16 A12,12 0 1,1 -12,-16 Z" fill="url(#goldGrad)"/>
    <polygon points="12,-6 15,-14 23,-14 17,-9 19,-1 12,-5 5,-1 7,-9 1,-14 9,-14" fill="url(#goldGrad)" transform="scale(0.55) translate(12, -8)"/>
  </g>
</svg>
